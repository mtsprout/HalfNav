# Xcode project definition. Regenerate the .xcodeproj after editing:
#   xcodegen generate   (https://github.com/yonaskolb/XcodeGen)
name: HalfNav
options:
  bundleIdPrefix: io.github.mtsprout
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.31.0

targets:
  # Runs Gradle to build the shared Kotlin core as an xcframework. A separate target, because Xcode
  # copies linked frameworks before a target's own build scripts run.
  HalfNavCore:
    type: ""
    platform: iOS
    legacy:
      toolPath: /bin/sh
      arguments: "$(SRCROOT)/Config/build-core.sh"
      passSettings: true
      workingDirectory: $(SRCROOT)
    settings:
      configs:
        Debug:
          HALFNAV_CORE_CONFIG: debug
        Release:
          HALFNAV_CORE_CONFIG: release

  HalfNav:
    type: application
    platform: iOS
    sources:
      - path: HalfNav
    dependencies:
      # Builds the Kotlin core first, so the app always links the latest version.
      - target: HalfNavCore
      - package: MapLibre
      # Shared Kotlin core (route planning, search ranking, voice wording, sun times).
      # Built by Gradle: ./gradlew :core:assembleHalfNavCoreDebugXCFramework (or Release).
      - framework: ../core/build/XCFrameworks/current/HalfNavCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mtsprout.halfnav
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "4"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_VERSION: "5.0"
      configs:
        Debug:
          HALFNAV_CORE_CONFIG: debug
        Release:
          HALFNAV_CORE_CONFIG: release
    info:
      path: HalfNav/Info.plist
      properties:
        CFBundleDisplayName: HalfNav
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TomTomKey: $(TOMTOM_KEY)
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchIcon
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [location, audio]
        NSLocationWhenInUseUsageDescription: HalfNav uses your location to plan trips, show you on the map, and give directions.
        NSLocationAlwaysAndWhenInUseUsageDescription: HalfNav keeps following your location during a trip so directions continue with the screen off.
        LSApplicationQueriesSchemes: [comgooglemaps]
        ITSAppUsesNonExemptEncryption: false

  HalfNavUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HalfNavUITests
    dependencies:
      - target: HalfNav
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mtsprout.halfnav.uitests
        TEST_TARGET_NAME: HalfNav
        GENERATE_INFOPLIST_FILE: YES

schemes:
  HalfNav:
    build:
      targets:
        HalfNav: all
        HalfNavUITests: [test]
    test:
      targets: [HalfNavUITests]
